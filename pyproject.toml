[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-direction"
version = "0.1.0"
description = "Next-day stock direction classifier for NVDA, TSLA, AAPL, MSFT, and AMZN."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bilal Abdullahi" }]
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "matplotlib>=3.9",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stock-train = "stock_direction.train:main"
stock-predict = "stock_direction.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
